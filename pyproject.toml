[project]
name = "tisiif-math-research-lab"
version = "2.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
 "fastapi==0.162.0", "pydantic==2.14.1", "pydantic-settings==2.16.1",
 "psycopg[binary,pool]==3.3.6", "httpx==0.28.1", "cryptography==50.0.2",
 "pypdf==6.21.2", "pypdfium2==5.14.0", "Pillow==13.0.0", "reportlab==5.1.0",
 "openpyxl==3.1.5", "jsonschema==4.26.0", "openai==3.37.0",
 "google-genai==2.33.0", "anthropic==2.3.0", "uvicorn[standard]==0.54.0",
 "python-multipart==0.0.32"
]
[dependency-groups]
dev = ["pytest==9.1.1", "pytest-timeout==2.4.0", "pglast==8.7", "ruff==0.17.2"]
[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/lab"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

