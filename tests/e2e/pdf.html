<!doctype html><html><body><h1>CI PDF worker canary</h1><input type="file" id="source"><button id="prepare" disabled>Prepare</button><pre id="result"></pre><script type="module">
import{pdfTask}from'/src/pdf.ts';document.querySelector('#prepare').disabled=false;document.querySelector('#prepare').onclick=async()=>{try{const file=document.querySelector('#source').files[0];const source=new Uint8Array(await file.arrayBuffer());const result=await pdfTask('prepare',source,{recipe:[{page:1,include:true,rotation:0,masks:[{x:0,y:.48,w:1,h:.52}]}]});const info=await pdfTask('inspect',result.bytes,{prepared:true});const preview=await pdfTask('preview',result.bytes,{page:1});const link=document.createElement('a');link.download='prepared-canary.pdf';link.href=URL.createObjectURL(new Blob([result.bytes],{type:'application/pdf'}));link.textContent='Download prepared PDF';document.body.append(link);const img=new Image();img.src=URL.createObjectURL(preview.blob);document.body.append(img);document.querySelector('#result').textContent=JSON.stringify(info)}catch(e){document.querySelector('#result').textContent='ERROR: '+e.message}};
</script></body></html>
